<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinSaver</title>
    <meta name="theme-color" content="#e60023">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
    <style>
        /* Phone first: the share sheet opens this page, often one-handed. */
        :root {
            color-scheme: light dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f0f0f0;
            color: #202020;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        .mark {
            font-size: 40px;
            line-height: 1;
        }

        h1 {
            font-size: 22px;
            margin: 12px 0 8px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: #444444;
            word-break: break-word;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            border-radius: 24px;
            background: #e60023;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #16171b;
                color: #ecebe6;
            }

            .card {
                background: #232428;
                box-shadow: none;
            }

            p {
                color: #b9b9b3;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">📌</div>
        <h1>{{heading}}</h1>
        <p>{{message}}</p>
        <a class="button" href="/">Open archive</a>
    </div>
</body>
</html>
