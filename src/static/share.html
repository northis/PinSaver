<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinSaver</title>
    <!-- The page is always dark, so the status bar is told so explicitly: a dark theme-color
         makes the browser draw light status icons, on any phone and in any phone theme. -->
    <meta name="theme-color" content="#16171b">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
    <style>
        /* Phone first: the share sheet opens this page, often one-handed. The page is always
           dark - it is a short result screen shown over whatever app shared the link - so it
           never follows the phone's light theme and its colours are declared once here. */
        :root {
            color-scheme: dark;
            background: #16171b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #16171b;
            color: #ecebe6;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #232428;
            border-radius: 16px;
            padding: 28px 24px;
        }

        .mark {
            font-size: 40px;
            line-height: 1;
        }

        h1 {
            font-size: 22px;
            margin: 12px 0 8px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: #b9b9b3;
            word-break: break-word;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            border-radius: 24px;
            background: #e60023;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">📌</div>
        <h1>{{heading}}</h1>
        <p>{{message}}</p>
        <a class="button" href="/">Open archive</a>
    </div>
</body>
</html>
