<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pinterest Archive Saver - Options</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 48px;
            height: 48px;
            flex: none;
        }

        h1 {
            color: #e60023;
            font-size: 24px;
            line-height: 1.2;
        }

        .subtitle {
            color: #666;
            margin-top: 4px;
        }

        .build-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 12px 0 32px;
            font-size: 12px;
        }

        .build-badge a {
            color: #666;
            text-decoration: none;
            border-bottom: 1px dotted #bbb;
        }

        .build-badge a:hover {
            color: #e60023;
            border-bottom-color: #e60023;
        }

        .build-badge .sep,
        .build-badge .muted {
            color: #999;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #e60023;
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .access-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 12px;
            color: #999;
        }

        button {
            background: #e60023;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #ad081b;
        }

        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .divider {
            margin: 32px 0 16px;
            border: none;
            border-top: 1px solid #e0e0e0;
        }

        .footer {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: #666;
            text-decoration: none;
        }

        .footer a:hover {
            color: #e60023;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img class="logo" src="icon48.png" alt="">
            <div>
                <h1>Pinterest Archive Saver</h1>
                <p class="subtitle">Configure your local archive server</p>
            </div>
        </div>

        <div class="build-badge">
            <a id="buildVersion" target="_blank" rel="noopener noreferrer"></a>
            <span class="sep">·</span>
            <a id="buildCommit" target="_blank" rel="noopener noreferrer" hidden></a>
            <span id="buildNote" class="muted">checking server...</span>
        </div>

        <div class="form-group">
            <label for="serverUrl">Server URL</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:8000">
            <p class="hint">Enter the URL of your Pinterest Archive server</p>
            <div class="access-row">
                <span id="accessState"></span>
                <button id="grantBtn" type="button">Grant access</button>
            </div>
        </div>

        <button id="saveBtn">Save Settings</button>

        <div class="status" id="status"></div>

        <hr class="divider">

        <div class="footer">
            <a id="repoLink" href="https://github.com/northis/PinSaver" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span class="sep">·</span>
            <a id="openArchive" href="#" target="_blank" rel="noopener noreferrer">Open archive</a>
            <span class="sep">·</span>
            <span>MIT License</span>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
